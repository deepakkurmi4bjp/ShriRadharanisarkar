<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>श्री मां नर्मदा भक्त परिवार — दान प्रबंधन</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#c45c0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="नर्मदा दान" />
    <meta name="application-name" content="नर्मदा दान" />
    <meta name="description" content="श्री मां नर्मदा भक्त परिवार — दान प्रबंधन प्रणाली" />

    <!-- Open Graph / WhatsApp / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="श्री मां नर्मदा भक्त परिवार" />
    <meta property="og:title" content="श्री मां नर्मदा भक्त परिवार — दान रसीद सत्यापन" />
    <meta property="og:description" content="आधिकारिक दान रसीद सत्यापन पोर्टल | Donation Receipt Verification Portal" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:type" content="image/jpeg" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="श्री मां नर्मदा भक्त परिवार — दान रसीद" />
    <meta name="twitter:description" content="आधिकारिक दान रसीद सत्यापन पोर्टल" />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
